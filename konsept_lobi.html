<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Siyaset Oyunu · 3 lobi konsepti</title><style>
@font-face{font-family:Plex;src:url('siyaset-oyunu/assets/fonts/IBMPlexMono-Regular.ttf')}@font-face{font-family:Plex;src:url('siyaset-oyunu/assets/fonts/IBMPlexMono-Bold.ttf');font-weight:700}
:root{--bg:#181430;--ink:#100d22;--panel:#2b2352;--light:#4a3f7a;--dark:#1c1738;--text:#f2efff;--muted:#a79bd6;--gold:#ffc93c;--green:#4be08a;--red:#e8402a}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--text);font:13px Plex,monospace}button,input{font:inherit}button{cursor:pointer;color:var(--text);border:3px solid var(--ink);background:var(--light);box-shadow:inset 2px 2px #68588e,inset -2px -2px #30264d;padding:9px 12px;min-height:40px}button:hover{filter:brightness(1.16)}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button.active,.gold{background:var(--gold);color:var(--ink);box-shadow:inset 2px 2px #ffe58a,inset -2px -2px #b08a22;font-weight:700}button.green{background:#258f53;box-shadow:inset 2px 2px #4be08a,inset -2px -2px #165735}.quiet{background:var(--dark)}header{max-width:1320px;margin:auto;padding:32px 28px 20px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:2px}h1{font-size:25px;margin:9px 0 10px}p{color:var(--muted);line-height:1.7;margin:8px 0}.designs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.designs button{text-align:left;padding:16px}.designs b{display:block;margin-bottom:8px}.designs small{font-size:11px;line-height:1.65;display:block;font-weight:400}.designs button.active small{color:#443318}main{max-width:1320px;margin:auto;padding:0 28px 36px}.caption{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:12px 0 20px}.caption p{font-size:12px;margin:0}.caption b{color:var(--text)}.screen{position:relative;min-height:720px;background:var(--bg);border:3px solid #4a3f7a;box-shadow:8px 8px #080614;padding:24px;overflow:hidden}.screen:before{content:'';position:absolute;pointer-events:none;inset:0;background:radial-gradient(ellipse at 10% 0%,#4a3f7a33,transparent 65%)}.screen>*{position:relative}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{font-weight:700;font-size:18px;letter-spacing:1px}.brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;letter-spacing:0;margin-top:6px}.code{display:flex;gap:8px;align-items:center;background:var(--dark);padding:7px 10px;border:2px solid var(--ink)}.code span{color:var(--muted);font-size:10px}.code b{color:var(--gold);font-size:18px;letter-spacing:3px}.code button{font-size:10px;padding:6px;min-height:30px}.panel{border:3px solid var(--ink);background:var(--panel);box-shadow:inset 2px 2px #645786,inset -2px -2px #1a1235,5px 5px var(--ink);padding:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panelhead h2{font-size:14px;margin:0}.dim{color:var(--muted);font-size:11px}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player{height:86px;padding:12px;display:flex;align-items:center;gap:10px;border:3px solid var(--ink);background:var(--dark);box-shadow:inset 1px 1px #4a3f7a;min-width:0}.player.empty{border-style:dashed;box-shadow:none;color:var(--muted)}.badge{width:42px;height:42px;flex:none;background:var(--c,#4a3f7a);border:3px solid var(--ink);display:grid;place-items:center;color:white;font-size:23px;font-weight:700}.who{min-width:0;flex:1}.who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.who small{display:block;margin-top:6px;font-size:10px;color:var(--muted)}.tag{background:var(--gold);color:var(--ink);padding:2px 5px;font-size:9px}.player button{padding:3px 8px;min-height:30px;font-size:16px}.section{padding:14px 0;border-top:2px solid #4a3f7a}.section:first-of-type{border-top:0;padding-top:0}.section h3{color:var(--gold);font-size:11px;letter-spacing:1px;margin:0 0 12px}.field{margin:0 0 14px}.field:last-child{margin-bottom:0}.fieldhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;font-size:11px}.fieldhead output{color:var(--gold);font-weight:700;white-space:nowrap}.segments{display:flex;gap:5px}.segments button{flex:1;font-size:11px;padding:7px 5px;min-width:0;min-height:36px}.segments.compact button{font-size:10px}.rail{display:flex;align-items:center;gap:8px}.rail small{font-size:9px;color:var(--muted)}input[type=range]{appearance:none;width:100%;height:9px;outline:none;border:2px solid var(--ink);background:linear-gradient(to right,var(--gold) var(--fill,50%),var(--ink) var(--fill,50%));margin:8px 0;cursor:pointer}input[type=range]::-webkit-slider-thumb{appearance:none;width:17px;height:22px;background:var(--gold);border:3px solid var(--ink);box-shadow:inset 2px 2px #ffe58a}input[type=range]::-moz-range-thumb{width:12px;height:17px;background:var(--gold);border:3px solid var(--ink);border-radius:0}.settings{max-height:535px;overflow:auto;padding-right:7px;scrollbar-color:var(--light) var(--ink);scrollbar-width:thin}.toggle{display:flex;align-items:center;gap:8px;font-size:11px;margin:10px 0;cursor:pointer}input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px}input[type=text]{background:var(--ink);color:var(--text);border:2px solid var(--light);padding:8px;width:100%;font-size:11px}.summary{background:var(--dark);border-left:3px solid var(--gold);padding:13px;margin-top:16px;font-size:11px;line-height:1.8;color:var(--muted)}.summary strong{color:var(--text)}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}.bottom .actions{display:flex;gap:8px}.ready{font-size:11px;color:var(--green)}.a-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(350px,1fr);gap:20px}.a-layout .left{display:flex;flex-direction:column}.a-layout .summary{margin-top:auto;padding-top:18px}.b-center{max-width:880px;margin:auto}.b-center .players{grid-template-columns:repeat(4,1fr)}.b-center .player{height:150px;flex-direction:column;text-align:center;gap:8px;position:relative}.b-center .player button{position:absolute;right:5px;top:5px}.b-center .who{width:100%}.b-center .summary{display:flex;align-items:center;justify-content:space-between;gap:16px}.b-center .summary button{white-space:nowrap}.overlay{position:absolute!important;inset:0;background:#100d22df;display:grid;place-items:center;padding:20px;z-index:2}.modal{width:600px;max-width:100%}.modal .settings{max-height:450px}.c-layout{max-width:1020px;margin:auto}.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{flex:1}.c-settings{display:grid;grid-template-columns:1fr 1fr;gap:24px}.c-settings .settings{max-height:none;overflow:visible}.c-settings .panel{padding:16px}.mobilehint{text-align:right;color:var(--muted);font-size:10px;margin-top:14px}.hidden{display:none!important}.notice{color:var(--gold);font-size:11px;margin-top:12px;min-height:18px}@media(max-width:1000px){.a-layout{grid-template-columns:1fr}.settings{max-height:500px}.screen{min-height:700px}.b-center .players{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){header,main{padding-left:12px;padding-right:12px}h1{font-size:20px}.designs{grid-template-columns:1fr}.designs button{padding:10px}.screen{padding:14px}.top{align-items:flex-start;flex-direction:column}.players{grid-template-columns:1fr}.b-center .players{grid-template-columns:repeat(2,1fr)}.c-settings{grid-template-columns:1fr}.bottom{align-items:stretch;flex-direction:column}.bottom .actions button{flex:1}.caption{flex-direction:column;align-items:flex-start}.b-center .summary{align-items:stretch;flex-direction:column}}
</style></head><body><header><div class="eyebrow">SİYASET OYUNU / LOBİ TASARIM ÇALIŞMASI</div><h1>Aynı arayüz dili. Üç farklı yerleşim.</h1><p>Bir düzen seç, oyuncu ekle ve ayarları değiştir. Üç konsept aynı kontrol setini kullanır.<br>Bu önizleme oyun dosyalarını değiştirmez.</p><nav class="designs" aria-label="Konseptler"><button class="active" data-design="A"><b>A · Her şey aynı ekranda</b><small>Oyuncular solda, kurallar sağda. Ayar yaparken oda görünür kalır.</small></button><button data-design="B"><b>B · Oyuncu odaklı lobi</b><small>Geniş oyuncu kartları. Kurallar tek bir açılır panelde düzenlenir.</small></button><button data-design="C"><b>C · İki sekmeli düzen</b><small>Oyuncular ve oyun kuralları ayrı sekmelerde. Daha geniş ayar alanı.</small></button></nav></header><main><div class="caption"><p id="explanation"></p><button id="reset" class="quiet">Varsayılanlara dön</button></div><div class="screen" id="screen"></div><div class="mobilehint">Dar ekranda da deneyebilirsin · Ayarlar konseptler arasında korunur</div></main><script>
const defaults={density:1,vote:30,turn:60,district:300,national:200,threshold:7,interval:2,elections:5,penalty:0,random:true,away:true,seed:''};let state={...defaults},design='A',tab='players',modal=false;let players=['Barış','Ada','Bot 1','Bot 2'];const colors=['#f2132a','#2569cf','#31c440','#ab39db'];
const descriptions={A:'<b>A · Yan yana düzen.</b> Odanın durumu ve kurallar birlikte görünür. Sağ panel kendi içinde kayar.',B:'<b>B · Oyuncu odaklı düzen.</b> Lobi sade kalır; “Kuralları düzenle” bütün ayarları tek panelde açar.',C:'<b>C · Sekmeli düzen.</b> Kurallar geniş alana yayılır. Oda kodu ve oyunu başlatma düğmesi her iki sekmede de görünür.'};
const labels={density:'İl sayısı',vote:'Meclis oylama süresi',turn:'Tur süresi',district:'İl milletvekilleri',national:'Ulusal milletvekilleri',threshold:'Seçim barajı',penalty:'Bot gelir zayıflatması'};
function segmented(key,values,names){return `<div class="field"><div class="fieldhead"><label>${labels[key]}</label></div><div class="segments ${values.length>4?'compact':''}" role="group" aria-label="${labels[key]}">${values.map((v,i)=>`<button data-key="${key}" data-value="${v}" class="${state[key]===v?'active':''}" aria-pressed="${state[key]===v}">${names?.[i]??v}</button>`).join('')}</div></div>`}
function slider(key,min,max,step,suffix){let val=state[key];return `<div class="field"><div class="fieldhead"><label for="slider-${key}">${labels[key]}</label><output id="out-${key}">${key==='threshold'?'%':''}${val}${suffix}</output></div><div class="rail"><small>${min}</small><input id="slider-${key}" data-range="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${val}" style="--fill:${(val-min)/(max-min)*100}%" aria-label="${labels[key]}"><small>${max}</small></div></div>`}
function section(title,body){return `<section class="section"><h3>${title}</h3>${body}</section>`}
function stepper(key,title,min,max){return `<div class="field"><div class="fieldhead">${title}<output>${state[key]}${key==='interval'?' yıl':''}</output></div><div class="segments"><button data-step="${key}" data-delta="-1" aria-label="${title} azalt">−</button><button class="quiet" disabled>${state[key]}</button><button data-step="${key}" data-delta="1" aria-label="${title} artır">+</button></div></div>`}
function sections(){return [section('HARİTA VE TEMSİL',segmented('density',[.75,1,1.25],['Az','Ortalama','Fazla'])+slider('district',150,750,50,'')+slider('national',0,300,50,'')),section('SÜRELER VE SEÇİMLER',segmented('vote',[15,30,45,60],['15 s','30 s','45 s','60 s'])+slider('turn',30,120,15,' s')+slider('threshold',0,10,.5,'')+stepper('interval','Seçimler kaç yılda bir?',1,8)+stepper('elections','Kaç seçim yapılacak?',2,12)),section('BOTLAR VE DİĞER AYARLAR',segmented('penalty',[0,5,10,15],['0','5','10','15'])+'<p style="font-size:10px">Botların dönemlik geliri seçilen tutar kadar (milyon ¤) azalır.</p>'+`<label class="toggle"><input type="checkbox" data-check="random" ${state.random?'checked':''}> Yeni bot partiler katılabilir</label><label class="toggle"><input type="checkbox" data-check="away" ${state.away?'checked':''}> Bağlantısı kopan oyuncunun yerine bot oynasın</label><div class="fieldhead"><label for="seed">Harita tohumu</label><span class="dim">İsteğe bağlı</span></div><input id="seed" type="text" inputmode="numeric" maxlength="12" value="${state.seed}" placeholder="Rastgele">`)];}
function playerCards(){return Array.from({length:8},(_,i)=>{let p=players[i];return p?`<div class="player"><div class="badge" style="--c:${colors[i%4]}">${i<2?'◆':'▣'}</div><div class="who"><b>${p}</b><small>${i===0?'<span class="tag">ODA SAHİBİ · SEN</span>':i===1?'Oyuncu':'Bot'}</small></div>${i>1?`<button data-remove="${i}" aria-label="${p} çıkar">−</button>`:''}</div>`:`<div class="player empty"><div class="badge">+</div><div class="who"><b>Boş koltuk</b><small>${i+1}. oyuncu</small></div><button data-add aria-label="Bot ekle">+</button></div>`}).join('')}
function summary(){return `<strong>${state.district+state.national} milletvekili</strong> · ${['Az','Ortalama','Fazla'][[.75,1,1.25].indexOf(state.density)]} il<br>${state.elections} seçim · ${state.interval} yılda bir · ${state.interval*state.elections} yıl<br>Tur ${state.turn} s · Meclis oylaması ${state.vote} s · Baraj %${state.threshold}`}
function footer(){return `<div class="bottom"><span class="ready">● ${players.length}/8 oyuncu · Oda hazır</span><div class="actions"><button class="quiet" data-demo="Lobiden ayrılma">Lobiden ayrıl</button><button class="green" data-demo="Oyunu başlatma">OYUNU BAŞLAT →</button></div></div><div class="notice" id="notice" aria-live="polite"></div>`}
function lobbyHeader(){return `<div class="top"><div class="brand">SİYASET OYUNU<small>Oyun lobisi · Çevrim içi</small></div><div class="code"><span>ODA KODU</span><b>H7K2Q</b><button data-copy>Kopyala</button></div></div>`}
function render(){document.querySelectorAll('[data-design]').forEach(b=>b.classList.toggle('active',b.dataset.design===design));document.getElementById('explanation').innerHTML=descriptions[design];let parts=sections(),body='';if(design==='A'){body=`<div class="a-layout"><div class="left panel"><div class="panelhead"><h2>OYUNCULAR</h2><span class="dim">En fazla 8</span></div><div class="players">${playerCards()}</div><div class="summary" data-summary>${summary()}</div></div><div class="panel"><div class="panelhead"><h2>OYUN KURALLARI</h2><span class="tag">ODA SAHİBİ</span></div><div class="settings">${parts.join('')}</div></div></div>${footer()}`;}else if(design==='B'){body=`<div class="b-center"><div class="panel"><div class="panelhead"><h2>OYUNCULAR</h2><span class="dim">Bot eklemek için +</span></div><div class="players">${playerCards()}</div></div><div class="summary"><div data-summary>${summary()}</div><button data-open>Kuralları düzenle ⚙</button></div>${footer()}</div>${modal?`<div class="overlay"><div class="modal panel"><div class="panelhead"><h2>OYUN KURALLARI</h2><button data-close aria-label="Paneli kapat">×</button></div><div class="settings">${parts.join('')}</div><div class="bottom"><span class="dim">Değişiklikler anında uygulanır</span><button class="gold" data-close>TAMAM</button></div></div></div>`:''}`;}else{body=`<div class="c-layout"><div class="tabs"><button data-tab="players" class="${tab==='players'?'active':''}">OYUNCULAR · ${players.length}/8</button><button data-tab="rules" class="${tab==='rules'?'active':''}">OYUN KURALLARI</button></div>${tab==='players'?`<div class="panel"><div class="players">${playerCards()}</div></div><div class="summary" data-summary>${summary()}</div>`:`<div class="c-settings"><div class="panel">${parts[0]}${parts[2]}</div><div class="panel">${parts[1]}</div></div>`}${footer()}</div>`;}document.getElementById('screen').innerHTML=lobbyHeader()+body;bind();}
function notify(text){document.getElementById('notice').textContent=text}
function bind(){document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{state[b.dataset.key]=Number(b.dataset.value);let scroll=document.querySelector('.settings')?.scrollTop||0;render();if(document.querySelector('.settings'))document.querySelector('.settings').scrollTop=scroll});document.querySelectorAll('[data-range]').forEach(input=>input.oninput=()=>{let k=input.dataset.range;state[k]=Number(input.value);let suffix=k==='turn'?' s':'';document.getElementById('out-'+k).textContent=(k==='threshold'?'%':'')+state[k]+suffix;input.style.setProperty('--fill',(state[k]-Number(input.min))/(Number(input.max)-Number(input.min))*100+'%');document.querySelectorAll('[data-summary]').forEach(el=>el.innerHTML=summary())});document.querySelectorAll('[data-check]').forEach(i=>i.onchange=()=>state[i.dataset.check]=i.checked);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{let k=b.dataset.step;state[k]=Math.max(k==='interval'?1:2,Math.min(k==='interval'?8:12,state[k]+Number(b.dataset.delta)));let scroll=document.querySelector('.settings')?.scrollTop||0;render();if(document.querySelector('.settings'))document.querySelector('.settings').scrollTop=scroll});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(players.length<8)players.push('Bot '+(players.filter(p=>p.startsWith('Bot')).length+1));render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{players.splice(Number(b.dataset.remove),1);render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{modal=true;render()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{modal=false;render()});document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>notify(b.dataset.demo+' bu konseptte yalnızca önizlemedir.'));document.querySelector('[data-copy]').onclick=async()=>{try{await navigator.clipboard.writeText('H7K2Q');notify('Oda kodu kopyalandı.')}catch{notify('Örnek oda kodu: H7K2Q')}};let seed=document.getElementById('seed');if(seed)seed.oninput=()=>{seed.value=seed.value.replace(/\D/g,'');state.seed=seed.value};}
document.querySelectorAll('[data-design]').forEach(b=>b.onclick=()=>{design=b.dataset.design;modal=false;tab='players';render()});document.getElementById('reset').onclick=()=>{state={...defaults};render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=false;render()}});render();
</script></body></html>
